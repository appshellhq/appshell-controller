{{- if .Values.serviceAccount.create }}
# The controller's identity, in the cluster and to the registry: a trusted-deployment record on
# each application names this account, in this namespace, under this cluster's issuer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appshell-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appshell-controller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Mounted on purpose: the controller reads and writes its resources through the API server.
automountServiceAccountToken: true
{{- end }}
