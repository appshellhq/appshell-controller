# This rule is not used by the project appshell-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to registry.appshell.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: appshell-controller
    app.kubernetes.io/managed-by: kustomize
  name: appshellapplication-viewer-role
rules:
- apiGroups:
  - registry.appshell.org
  resources:
  - appshellapplications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - registry.appshell.org
  resources:
  - appshellapplications/status
  verbs:
  - get
