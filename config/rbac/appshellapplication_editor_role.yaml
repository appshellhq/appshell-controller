# This rule is not used by the project appshell-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the registry.appshell.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: appshell-controller
    app.kubernetes.io/managed-by: kustomize
  name: appshellapplication-editor-role
rules:
- apiGroups:
  - registry.appshell.org
  resources:
  - appshellapplications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - registry.appshell.org
  resources:
  - appshellapplications/status
  verbs:
  - get
