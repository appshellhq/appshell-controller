# This rule is not used by the project appshell-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over registry.appshell.org.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: appshell-controller
    app.kubernetes.io/managed-by: kustomize
  name: appshellapplication-admin-role
rules:
- apiGroups:
  - registry.appshell.org
  resources:
  - appshellapplications
  verbs:
  - '*'
- apiGroups:
  - registry.appshell.org
  resources:
  - appshellapplications/status
  verbs:
  - get
