name: Tests

# Pushes to main and pull requests; a branch pushed without a pull request runs nothing, and a
# pull request's superseded runs are cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # What's committed is what builds: go.mod and go.sum tidy, and the CRD, RBAC and deepcopy
      # code generated from the types as they stand. A type changed without regenerating would
      # otherwise ship a CRD that disagrees with the controller.
      - name: Check modules are tidy
        run: go mod tidy -diff

      - name: Check generated code is committed
        run: |
          make manifests generate
          git diff --exit-code -- config api

      - name: Run tests
        run: make test

  vulnerabilities:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Reports only vulnerabilities in code the controller actually calls, so a finding is one
      # to act on.
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
