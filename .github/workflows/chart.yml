name: Chart

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  chart:
    permissions:
      contents: read
    name: Lint, render and validate
    runs-on: ubuntu-latest
    env:
      CHART: charts/appshell-controller
      # Pinned with its checksum, so what validates the chart changes only by a commit here.
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # The chart's CRD is generated from the one controller-gen writes; it must not drift.
      - name: Check the chart's CRD is generated
        run: |
          hack/chart-crds.sh
          git diff --exit-code -- "${CHART}/templates/crds.yaml"

      - name: Lint
        run: helm lint --strict "$CHART" --set registry.url=https://registry.example.com

      # Every shape the chart renders, validated against Kubernetes' schemas.
      - name: Render and validate
        run: |
          set -o pipefail
          render() { helm template ci "$CHART" --namespace appshell "$@"; }
          # Every kind validated against Kubernetes' schemas, strictly, but the CRD: kubeconform has no
          # schema for CustomResourceDefinition itself, and the CRD's own schema is controller-gen's,
          # checked above against the generated copy.
          validate() { kubeconform -strict -summary -kubernetes-version 1.33.0 -skip CustomResourceDefinition -; }
          render --set registry.url=https://registry.example.com | validate
          render --set registry.url=https://registry.example.com --set 'watchNamespaces={apps,shop}' | validate
          render --set registry.url=https://registry.example.com --set metrics.enabled=false \
            --set networkPolicy.enabled=false --set leaderElection.enabled=false --set crds.install=false | validate

      # What the chart must refuse, refused.
      - name: Refuse unsafe values
        run: |
          refuse() { if helm template ci "$CHART" "$@" >/dev/null 2>&1; then echo "::error::accepted: $*"; exit 1; fi; }
          refuse
          refuse --set registry.url=http://registry.example.com
          refuse --set registry.url=https://registry.example.com --set token.expirationSeconds=7200
          refuse --set registry.url=https://registry.example.com --set image.digest=latest
          refuse --set registry.url=https://registry.example.com --set reconcileInterval=30s
          refuse --set registry.url=https://registry.example.com --set replicaCounts=2
          refuse --set registry.url=https://registry.example.com --set metrics.port=8081
          refuse --set registry.url=https://registry.example.com --set podLabels.app\\.kubernetes\\.io/name=other
