name: Release

# Releases are cut by release-please. It keeps a release PR open with the next version, computed
# from conventional commits, and the changelog; merging it tags vX.Y.Z on main, and the publish
# job below runs in this same workflow, since a tag pushed with the workflow's own token triggers
# no other workflow.
#
# The publish job runs in the release environment, which only main may deploy from
# (navaris/platform-terragrunt github/appshellhq/appshell-controller): only a release merged to
# main can mint the token that pushes and signs.
on:
  push:
    branches: [main]

# One release at a time, never cancelled midway: a half-published release is worse than a late one.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish signed image and chart
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Push the image and the chart to GHCR.
      packages: write
      # Keyless signing and provenance: the job's OIDC token is the signing identity.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/appshell-controller
      CHARTS: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Clone the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      # The chart release-please bumped must be the version being published, image and chart alike.
      - name: Check the chart's version is the release's
        run: |
          chart=$(yq '.version' charts/appshell-controller/Chart.yaml)
          app=$(yq '.appVersion' charts/appshell-controller/Chart.yaml)
          if [ "$chart" != "$VERSION" ] || [ "$app" != "$VERSION" ]; then
            echo "::error::Chart.yaml says $chart / $app; the release is $VERSION"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One immutable tag, the version; no floating tags like latest, so what a tag names never
      # changes. The builder cross-compiles from the build platform, so no emulation is needed.
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=appshell-controller
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          # SLSA provenance and an SBOM, attached to the image as attestations.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Keyless: signed with a certificate Sigstore issues for this workflow's identity, so there is
      # no key to keep or leak. Verifiable with cosign verify --certificate-identity-regexp
      # 'https://github.com/appshellhq/appshell-controller/.github/workflows/release.yml@.*'.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.image.outputs.digest }}"

      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # The chart pins the image by the digest just pushed, not the tag, so the chart and the image
      # it installs can't drift apart.
      - name: Package and push the chart
        id: chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          yq -i ".image.digest = strenv(DIGEST)" charts/appshell-controller/values.yaml
          helm package charts/appshell-controller --destination dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          out=$(helm push "dist/appshell-controller-${VERSION}.tgz" "oci://${CHARTS}" 2>&1)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        run: cosign sign --yes "${CHARTS}/appshell-controller@${{ steps.chart.outputs.digest }}"

      - name: Attest the chart's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHARTS }}/appshell-controller
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
